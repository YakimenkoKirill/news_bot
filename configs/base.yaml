app:
  timezone: Europe/Moscow

db:
  pool_size: 5
  max_overflow: 5
  pool_pre_ping: true
  echo: false

collectors:
  user_agent: "MyNewsBot/1.0 (+https://t.me/ward3r0)"
  http_timeout_s: 20
  per_domain_rps: 1
  max_retries: 3
  robots_ttl_h: 24
  min_article_chars: 200
  max_articles_per_run: 10
  max_consecutive_errors: 5
  stale_after_h: 6
  max_parallel_sources: 5

telegram:
  flood_wait_extra_s: 1
  flood_wait_max_retries: 3
  flood_wait_max_s: 300
  title_max_chars: 120
  album_wait_s: 2
